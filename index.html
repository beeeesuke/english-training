<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <title>クルーズ英会話トレーナー</title>
  <style>
    :root {
      --navy: #0b3d52;
      --ocean: #087e8b;
      --sky: #eaf7f7;
      --paper: #fffdf8;
      --ink: #18323d;
      --muted: #647780;
      --line: #d8e5e5;
      --coral: #f28f6b;
      --shadow: 0 18px 50px rgba(11, 61, 82, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(160deg, #dff4f3 0%, #f7fbf8 52%, #fff5e9 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      padding: max(18px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom));
    }

    button, input, select { font: inherit; }
    button { touch-action: manipulation; }

    .app { width: min(720px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin: 6px 2px 18px; }
    .mark {
      display: grid; place-items: center; width: 48px; height: 48px;
      border-radius: 15px; color: white; background: var(--navy); font-size: 24px;
      box-shadow: 0 8px 20px rgba(11, 61, 82, .2);
    }
    h1 { margin: 0; color: var(--navy); font-size: clamp(20px, 5vw, 28px); letter-spacing: .02em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .card {
      background: rgba(255, 253, 248, .96); border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px; box-shadow: var(--shadow); overflow: hidden;
    }
    .card-top { padding: 20px 20px 0; }
    .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .counter { color: var(--muted); font-size: 13px; font-weight: 700; }
    .level-pill {
      color: var(--ocean); background: var(--sky); border: 1px solid #cae8e7;
      border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800;
    }
    .progress { height: 7px; background: #e8efed; border-radius: 9px; margin-top: 13px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--ocean), #44b9af); border-radius: inherit; transition: width .25s ease; }

    .prompt { padding: 30px 22px 28px; text-align: center; }
    .label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .japanese { margin: 8px 0 26px; font-size: clamp(17px, 4.6vw, 22px); font-weight: 650; }
    .english {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
      gap: 10px 8px; min-height: 84px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 7.2vw, 38px); line-height: 1.45; color: var(--navy);
    }
    .word { display: inline-block; }
    .blank {
      min-width: 2.1em; color: transparent; user-select: none;
      border-bottom: 3px solid var(--coral); border-radius: 2px;
      background: linear-gradient(to top, rgba(242,143,107,.12), transparent 55%);
    }
    .revealed { color: var(--coral); animation: reveal .2s ease; }
    @keyframes reveal { from { opacity: .2; transform: translateY(4px); } }

    .study-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 20px 18px; }
    .answer-button, .speak-button {
      width: 100%; min-height: 50px;
      border: 1px solid #b8d9d8; border-radius: 14px; color: var(--ocean);
      background: #f2fbfa; font-weight: 800; cursor: pointer;
    }
    .speak-button { color: white; background: var(--ocean); border-color: var(--ocean); }
    .answer-button:active, .speak-button:active { transform: translateY(1px); }
    .speak-button:disabled { opacity: .45; cursor: default; }
    .speed-control {
      grid-column: 1 / -1; display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--muted); font-size: 13px; font-weight: 750;
    }
    .speed-control label { margin: 0; white-space: nowrap; }
    .speed-control select {
      min-height: 42px; padding: 7px 34px 7px 12px; color: var(--navy); background: white;
      border: 1px solid var(--line); border-radius: 12px; font-weight: 750; cursor: pointer;
    }
    .speed-control select:focus { outline: 3px solid rgba(8,126,139,.12); border-color: var(--ocean); }

    .grammar-area { margin: 0 20px 18px; }
    .grammar-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .grammar-toggle { flex: 1; min-width: 150px; }
    .pos-option {
      display: none; align-items: center; gap: 8px; min-height: 46px; padding: 8px 12px;
      color: var(--muted); background: #f7faf9; border: 1px solid var(--line);
      border-radius: 12px; font-size: 13px; font-weight: 750;
    }
    .pos-option.visible { display: flex; }
    .pos-option input { width: 18px; height: 18px; min-height: 0; margin: 0; accent-color: var(--ocean); }
    .grammar-panel { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; background: white; overflow: hidden; }
    .grammar-panel[hidden] { display: none; }
    .grammar-scroll { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
    .grammar-grid { display: flex; min-width: max-content; }
    .grammar-word {
      display: grid; grid-auto-rows: minmax(48px, auto);
      width: clamp(92px, 24vw, 128px); border-right: 1px solid var(--line); text-align: center;
    }
    .grammar-word:last-child { border-right: 0; }
    .grammar-cell { display: grid; place-items: center; padding: 8px 6px; line-height: 1.3; overflow-wrap: anywhere; }
    .grammar-token { color: var(--navy); font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; }
    .grammar-pos { color: var(--ocean); background: #f0f9f8; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 850; }
    .grammar-meaning { color: var(--ink); font-size: 12px; }
    .grammar-role { color: #72512a; background: #fff8e9; border-top: 1px solid var(--line); font-size: 12px; font-weight: 850; }
    .sentence-info { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; border-top: 1px solid var(--line); background: #fffdf8; }
    .sentence-info[hidden] { display: none; }
    .sentence-badge { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid #eadfc9; border-radius: 11px; color: var(--ink); font-size: 13px; line-height: 1.5; }
    .sentence-badge strong { display: block; margin-bottom: 2px; color: #8a6435; font-size: 11px; letter-spacing: .08em; }
    .grammar-hidden { color: transparent; user-select: none; position: relative; }
    .grammar-hidden::after { content: "____"; position: absolute; color: var(--coral); letter-spacing: .08em; }
    .grammar-masked { color: transparent; user-select: none; position: relative; }
    .grammar-masked::after { content: "****"; position: absolute; color: var(--muted); letter-spacing: .08em; }
    .grammar-notes { margin-top: 12px; padding: 15px 16px 16px; border: 1px solid var(--line); border-radius: 16px; background: white; }
    .grammar-notes[hidden] { display: none; }
    .grammar-notes h2 { margin: 0 0 8px; color: var(--navy); font-size: 15px; }
    .grammar-pattern { margin: 0 0 7px; color: var(--ocean); font-weight: 850; line-height: 1.6; }
    .grammar-explanation { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.75; white-space: pre-line; }

    .grade-hint { display: none; margin: -4px 20px 10px; text-align: center; color: var(--muted); font-size: 13px; }
    .grade-controls { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 12px; }
    .grade-controls.visible { display: grid; }
    .btn.wrong { color: #a44732; background: #fff4f0; border-color: #f0c5b8; }
    .btn.correct { color: white; background: var(--ocean); border-color: var(--ocean); }
    .level-controls, .problem-controls { display: grid; gap: 10px; padding: 0 20px 12px; }
    .level-controls { grid-template-columns: 1fr 1.25fr; }
    .problem-controls { grid-template-columns: 1fr 1fr 1fr; padding-bottom: 20px; }
    .btn {
      min-height: 48px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line);
      background: white; color: var(--navy); font-weight: 750; cursor: pointer;
    }
    .btn.primary { color: white; background: var(--navy); border-color: var(--navy); }
    .btn:disabled { opacity: .42; cursor: default; }
    .btn:not(:disabled):active { transform: translateY(1px); }

    details {
      margin-top: 18px; background: rgba(255,255,255,.72); border: 1px solid rgba(190,215,215,.8);
      border-radius: 18px; overflow: hidden;
    }
    summary { padding: 16px 18px; color: var(--navy); font-weight: 800; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "＋"; float: right; color: var(--ocean); }
    details[open] summary::after { content: "−"; }
    form { padding: 0 18px 18px; }
    .field { margin-top: 12px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 750; }
    input {
      width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line);
      border-radius: 12px; background: white; color: var(--ink); outline: none;
    }
    input:focus { border-color: var(--ocean); box-shadow: 0 0 0 3px rgba(8,126,139,.12); }
    .add-row { display: flex; gap: 10px; margin-top: 14px; }
    .add-row .btn { flex: 1; }
    .message { min-height: 20px; margin: 10px 2px 0; color: var(--ocean); font-size: 13px; font-weight: 700; }
    footer { margin-top: 15px; text-align: center; color: var(--muted); font-size: 12px; }

    @media (max-width: 430px) {
      .level-controls { grid-template-columns: 1fr 1fr; }
      .problem-controls { grid-template-columns: 1fr 1fr; }
      #nextProblem { grid-column: 1 / -1; }
      .prompt { padding-inline: 16px; }
      .grammar-toolbar { align-items: stretch; }
      .grammar-toggle, .pos-option { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="mark" aria-hidden="true">⚓</div>
      <div><h1>クルーズ英会話トレーナー</h1><p class="subtitle">少しずつ隠して、自然に一文を覚えよう</p></div>
    </header>

    <section class="card" aria-label="英会話の暗記問題">
      <div class="card-top">
        <div class="meta"><span class="counter" id="counter"></span><span class="level-pill" id="levelPill"></span></div>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div class="prompt">
        <div class="label">日本語</div>
        <p class="japanese" id="japanese"></p>
        <div class="label">ENGLISH</div>
        <div class="english" id="english" aria-live="polite"></div>
      </div>
      <div class="grammar-area">
        <div class="grammar-toolbar">
          <button class="btn grammar-toggle" id="grammarToggle" type="button" aria-expanded="false">品詞を表示</button>
          <button class="btn grammar-toggle" id="roleToggle" type="button" aria-expanded="false">役割・時制を表示</button>
          <button class="btn grammar-toggle" id="grammarPointToggle" type="button" aria-expanded="false">文法ポイントを表示</button>
          <label class="pos-option" id="posOption"><input id="hidePos" type="checkbox"> 穴埋め時に品詞も隠す</label>
        </div>
        <section class="grammar-panel" id="grammarPanel" aria-label="単語の品詞・役割・意味" hidden>
          <div class="grammar-scroll"><div class="grammar-grid" id="grammarGrid"></div></div>
          <div class="sentence-info" id="sentenceInfo" hidden>
            <div class="sentence-badge"><strong>時制</strong><span id="tenseText"></span></div>
            <div class="sentence-badge"><strong>文の種類</strong><span id="sentenceTypeText"></span></div>
          </div>
        </section>
        <section class="grammar-notes" id="grammarNotesPanel" aria-label="文法ポイントと解説" hidden>
          <h2>文法ポイント</h2>
          <p class="grammar-pattern" id="grammarPoint"></p>
          <p class="grammar-explanation" id="grammarExplanation"></p>
        </section>
      </div>
      <div class="study-actions">
        <button class="answer-button" id="answerButton" type="button">答えを表示</button>
        <button class="speak-button" id="speakButton" type="button" aria-label="英文を読み上げる">🔊 英文を聞く</button>
        <div class="speed-control">
          <label for="speedSelect">読み上げ速度</label>
          <select id="speedSelect">
            <option value="0.5">とてもゆっくり</option>
            <option value="0.65" selected>ゆっくり</option>
            <option value="0.9">ふつう</option>
          </select>
        </div>
      </div>
      <div class="grade-hint" id="gradeHint">自分の答えを判定してください</div>
      <div class="grade-controls" id="gradeControls">
        <button class="btn wrong" id="wrongButton" type="button">✕ 不正解</button>
        <button class="btn correct" id="correctButton" type="button">✓ 正解</button>
      </div>
      <div class="level-controls">
        <button class="btn" id="prevLevel" type="button">← 前のレベル</button>
        <button class="btn primary" id="nextLevel" type="button">次のレベル →</button>
      </div>
      <div class="problem-controls">
        <button class="btn" id="shuffle" type="button">⇄ シャッフル</button>
        <button class="btn" id="reset" type="button">↺ リセット</button>
        <button class="btn primary" id="nextProblem" type="button">次の問題 ›</button>
      </div>
    </section>

    <details>
      <summary>英文を追加する</summary>
      <form id="addForm">
        <div class="field"><label for="newEnglish">英文</label><input id="newEnglish" required autocomplete="off" placeholder="例: Where is the theater?"></div>
        <div class="field"><label for="newJapanese">日本語訳</label><input id="newJapanese" required autocomplete="off" placeholder="例: 劇場はどこですか？"></div>
        <div class="add-row"><button class="btn primary" type="submit">この英文を追加</button></div>
        <div class="message" id="message" role="status"></div>
      </form>
    </details>
    <footer>追加した英文は、この端末のブラウザに保存されます。</footer>
  </main>

        const restoredOrder = [];
        if (Array.isArray(savedLearningState.order)) {
          savedLearningState.order.forEach(en => {
            const index = indexByEnglish.get(en);
            if (index !== undefined && !restoredOrder.includes(index)) restoredOrder.push(index);
          });
        }
        questions.forEach((_, i) => { if (!restoredOrder.includes(i)) restoredOrder.push(i); });
        order = restoredOrder;
        questions.forEach((q, i) => {
          const max = wordsOf(q.en).length;
          const savedLevel = Number(savedLearningState.levels && savedLearningState.levels[q.en]);
          if (Number.isFinite(savedLevel)) levels[i] = Math.max(1, Math.min(Math.round(savedLevel), max));
          const savedHidden = savedLearningState.hiddenOrders && savedLearningState.hiddenOrders[q.en];
          if (Array.isArray(savedHidden) && savedHidden.length === max && new Set(savedHidden).size === max && savedHidden.every(n => Number.isInteger(n) && n >= 0 && n < max)) {
            hiddenOrders[i] = savedHidden.slice();
          }
        });
        const currentIndex = indexByEnglish.get(savedLearningState.current);
        const restoredPosition = currentIndex === undefined ? -1 : order.indexOf(currentIndex);
        position = restoredPosition >= 0 ? restoredPosition : 0;
        level = levels[order[position]] || 1;
        showAnswer = savedLearningState.showAnswer === true;
        grammarVisible = savedLearningState.grammarVisible === true;
        roleVisible = savedLearningState.roleVisible === true;
        grammarPointVisible = savedLearningState.grammarPointVisible === true;
        hidePos = savedLearningState.hidePos === true;
        const speed = String(savedLearningState.speed || '');
        if (['0.5', '0.65', '0.9'].includes(speed)) $('speedSelect').value = speed;
      }
      function saveLearningState() {
        const levelMap = {};
        const hiddenMap = {};
        questions.forEach((q, i) => {
          levelMap[q.en] = levels[i];
          hiddenMap[q.en] = hiddenOrders[i];
        });
        const state = {
          order: order.map(i => questions[i].en),
          current: current().en,
          levels: levelMap,
          hiddenOrders: hiddenMap,
          speed: $('speedSelect').value,
          showAnswer,
          grammarVisible,
          roleVisible,
          grammarPointVisible,
          hidePos
        };
        try { localStorage.setItem('cruiseEnglishLearningState', JSON.stringify(state)); } catch {}
      }
      restoreLearningState();
      function current() { return questions[order[position]]; }
      function hiddenIndexes(wordCount) {
        const count = Math.min(level, wordCount);
        return hiddenOrders[order[position]].slice(0, count);
      }
      function renderGrammar(q, hidden) {
        $('grammarPanel').hidden = !(grammarVisible || roleVisible);
        $('sentenceInfo').hidden = !roleVisible;
        $('grammarNotesPanel').hidden = !grammarPointVisible;
        $('grammarToggle').textContent = grammarVisible ? '品詞を非表示' : '品詞を表示';
        $('grammarToggle').setAttribute('aria-expanded', String(grammarVisible));
        $('roleToggle').textContent = roleVisible ? '役割・時制を非表示' : '役割・時制を表示';
        $('roleToggle').setAttribute('aria-expanded', String(roleVisible));
        $('grammarPointToggle').textContent = grammarPointVisible ? '文法ポイントを非表示' : '文法ポイントを表示';
        $('grammarPointToggle').setAttribute('aria-expanded', String(grammarPointVisible));
        $('posOption').classList.toggle('visible', grammarVisible);
        $('hidePos').checked = hidePos;
        const cells = q.words.map((word, i) => {
          const column = document.createElement('div');
          column.className = 'grammar-word';
          const token = document.createElement('div');
          token.className = 'grammar-cell grammar-token' + (hidden.has(i) && !showAnswer ? ' grammar-hidden' : '');
          token.textContent = word.text;
          column.append(token);
          if (grammarVisible) {
            const pos = document.createElement('div');
            pos.className = 'grammar-cell grammar-pos' + (hidePos && hidden.has(i) && !showAnswer ? ' grammar-masked' : '');
            pos.textContent = word.pos;
            const meaning = document.createElement('div');
            meaning.className = 'grammar-cell grammar-meaning';
            meaning.textContent = word.meaning;
            column.append(pos, meaning);
          }
          if (roleVisible) {
            const role = document.createElement('div');
            role.className = 'grammar-cell grammar-role';
            role.textContent = word.role;
            column.append(role);
          }
          return column;
        });
        $('grammarGrid').replaceChildren(...cells);
        $('tenseText').textContent = q.tense;
        $('sentenceTypeText').textContent = q.sentenceType;
        $('grammarPoint').textContent = q.grammarPoint;
        $('grammarExplanation').textContent = q.grammarExplanation;
      }
      function render() {
        const q = current();
        const words = wordsOf(q.en);
        const hidden = new Set(hiddenIndexes(words.length));
        $('counter').textContent = `問題 ${position + 1} / ${questions.length}`;
        $('levelPill').textContent = `レベル ${Math.min(level, words.length)} / ${words.length}`;
        $('progressBar').style.width = `${Math.min(level, words.length) / words.length * 100}%`;
        $('japanese').textContent = q.ja;
        $('english').replaceChildren(...words.map((word, i) => {
          const span = document.createElement('span');
          span.className = 'word' + (hidden.has(i) ? (showAnswer ? ' revealed' : ' blank') : '');
          span.textContent = word;
          return span;
        }));
        $('answerButton').textContent = showAnswer ? '穴埋めに戻す' : '答えを表示';
        $('gradeControls').classList.toggle('visible', showAnswer);
        $('gradeHint').style.display = showAnswer ? 'block' : 'none';
        $('prevLevel').disabled = level <= 1;
        $('nextLevel').disabled = level >= words.length;
        renderGrammar(q, hidden);
        saveLearningState();
      }
      function moveProblem(step) {
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        position = (position + step + order.length) % order.length;
        level = levels[order[position]] || 1; showAnswer = false; render();
      }
      function speakCurrentSentence() {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(current().en);
        utterance.lang = 'en-US';
        utterance.rate = Number($('speedSelect').value);
        const voices = speechSynthesis.getVoices();
        utterance.voice = voices.find(voice => voice.lang === 'en-US') || voices.find(voice => voice.lang.startsWith('en')) || null;
        $('speakButton').textContent = '🔊 読み上げ中…';
        const finish = () => { $('speakButton').textContent = '🔊 英文を聞く'; };
        utterance.onend = finish;
        utterance.onerror = finish;
        speechSynthesis.speak(utterance);
      }
      function grade(isCorrect) {
        const questionIndex = order[position];
        const max = wordsOf(current().en).length;
        levels[questionIndex] = isCorrect ? Math.min(level + 1, max) : Math.max(level - 1, 1);
        moveProblem(1);
      }
      $('answerButton').addEventListener('click', () => { showAnswer = !showAnswer; render(); });
      $('grammarToggle').addEventListener('click', () => { grammarVisible = !grammarVisible; render(); });
      $('roleToggle').addEventListener('click', () => { roleVisible = !roleVisible; render(); });
      $('grammarPointToggle').addEventListener('click', () => { grammarPointVisible = !grammarPointVisible; render(); });
      $('hidePos').addEventListener('change', event => { hidePos = event.target.checked; render(); });
      $('speakButton').addEventListener('click', speakCurrentSentence);
      $('speakButton').disabled = !('speechSynthesis' in window);
      $('speedSelect').addEventListener('change', saveLearningState);
      $('correctButton').addEventListener('click', () => grade(true));
      $('wrongButton').addEventListener('click', () => grade(false));
      $('prevLevel').addEventListener('click', () => { if (level > 1) { level--; levels[order[position]] = level; showAnswer = false; render(); } });
      $('nextLevel').addEventListener('click', () => { const max = wordsOf(current().en).length; if (level < max) { level++; levels[order[position]] = level; showAnswer = false; render(); } });
      $('nextProblem').addEventListener('click', () => moveProblem(1));
      $('reset').addEventListener('click', () => { order = questions.map((_, i) => i); levels = questions.map(() => 1); hiddenOrders = questions.map(q => randomWordOrder(q.en)); position = 0; level = 1; showAnswer = false; $('message').textContent = ''; render(); });
      $('shuffle').addEventListener('click', () => {
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
        position = 0; level = levels[order[position]] || 1; showAnswer = false; render();
      });
      $('addForm').addEventListener('submit', event => {
        event.preventDefault();
        const en = $('newEnglish').value.trim();
        const ja = $('newJapanese').value.trim();
        if (!en || !ja) return;
        const item = enrichQuestion({ en, ja });
        questions.push(item); order.push(questions.length - 1); levels.push(1); hiddenOrders.push(randomWordOrder(en));
        try { localStorage.setItem('cruiseEnglishSentences', JSON.stringify(questions.slice(defaults.length))); } catch {}
        position = order.length - 1; level = 1; showAnswer = false;
        event.target.reset(); $('message').textContent = '追加しました。今、追加した英文を表示しています。'; render();
      });
      document.addEventListener('keydown', event => {
        if (event.target.matches('input')) return;
        if (event.key === 'ArrowRight') $('nextLevel').click();
        if (event.key === 'ArrowLeft') $('prevLevel').click();
        if (event.key === ' ') { event.preventDefault(); $('answerButton').click(); }
      });
      render();
    })();
  </script>
</body>
</html>
